<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062a1e"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#25d366" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#25d366" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>

  <!-- Title -->
  <g transform="translate(80 90)">
    <circle cx="28" cy="28" r="28" fill="#25d366"/>
    <path d="M28 12a16 16 0 0 0-13.7 24.3L12 44l7.9-2.2A16 16 0 1 0 28 12z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    <text x="76" y="24" fill="#ffffff" font-size="30" font-weight="700">WhatsApp Bot Manager</text>
    <text x="76" y="54" fill="#a1a1aa" font-size="18">Chatbots com IA, fluxos e atendimento em um só lugar</text>
  </g>

  <!-- Chat window -->
  <g transform="translate(80 200)">
    <rect width="500" height="520" rx="24" fill="#18181b" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect width="500" height="64" rx="24" fill="#1f1f23"/>
    <rect y="40" width="500" height="24" fill="#1f1f23"/>
    <circle cx="40" cy="32" r="16" fill="#25d366" fill-opacity="0.25"/>
    <text x="68" y="38" fill="#e4e4e7" font-size="17" font-weight="600">Assistente virtual</text>
    <circle cx="440" cy="32" r="5" fill="#25d366"/>
    <text x="452" y="37" fill="#a1a1aa" font-size="13">online</text>

    <rect x="24" y="92" width="270" height="56" rx="16" fill="#27272a"/>
    <text x="44" y="126" fill="#e4e4e7" font-size="16">Oi! Queria agendar um horário</text>

    <rect x="196" y="168" width="280" height="80" rx="16" fill="#005c4b"/>
    <text x="216" y="200" fill="#ffffff" font-size="16">Claro! Tenho amanhã às 10h</text>
    <text x="216" y="226" fill="#ffffff" font-size="16">ou às 15h. Qual prefere?</text>

    <rect x="24" y="268" width="150" height="56" rx="16" fill="#27272a"/>
    <path d="M48 288v16M56 282v28M64 290v12M72 284v24M80 292v8M88 286v20M96 290v12" stroke="#a1a1aa" stroke-width="3" stroke-linecap="round"/>
    <text x="110" y="302" fill="#a1a1aa" font-size="14">0:04</text>

    <rect x="196" y="344" width="280" height="80" rx="16" fill="#005c4b"/>
    <text x="216" y="376" fill="#ffffff" font-size="16">Agendado para amanhã, 15h ✓</text>
    <text x="216" y="402" fill="#9ee6c4" font-size="14">Lembrete programado</text>

    <rect x="24" y="452" width="452" height="44" rx="22" fill="#27272a"/>
    <text x="48" y="480" fill="#71717a" font-size="15">Digite uma mensagem</text>
  </g>

  <!-- Flow editor -->
  <g transform="translate(640 200)" font-size="15">
    <rect width="560" height="520" rx="24" fill="#18181b" fill-opacity="0.7" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="28" y="44" fill="#a1a1aa" font-size="14" letter-spacing="2">FLUXO DE ATENDIMENTO</text>

    <g fill="none" stroke="#25d366" stroke-opacity="0.6" stroke-width="2.5">
      <path d="M280 120v50"/>
      <path d="M280 226c0 40-140 30-140 74"/>
      <path d="M280 226c0 40 140 30 140 74"/>
      <path d="M140 356v54"/>
    </g>

    <rect x="180" y="72" width="200" height="48" rx="14" fill="#14532d" stroke="#25d366"/>
    <text x="280" y="102" fill="#ffffff" text-anchor="middle" font-weight="600">Mensagem recebida</text>

    <rect x="160" y="170" width="240" height="56" rx="14" fill="#27272a" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="280" y="196" fill="#ffffff" text-anchor="middle" font-weight="600">Assistente de IA</text>
    <text x="280" y="215" fill="#a1a1aa" text-anchor="middle" font-size="13">prompt + ferramentas</text>

    <rect x="40" y="300" width="200" height="56" rx="14" fill="#27272a" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="140" y="326" fill="#ffffff" text-anchor="middle" font-weight="600">Agendar mensagem</text>
    <text x="140" y="345" fill="#a1a1aa" text-anchor="middle" font-size="13">lembrete automático</text>

    <rect x="320" y="300" width="200" height="56" rx="14" fill="#27272a" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="420" y="326" fill="#ffffff" text-anchor="middle" font-weight="600">Transferir</text>
    <text x="420" y="345" fill="#a1a1aa" text-anchor="middle" font-size="13">atendente humano</text>

    <rect x="40" y="410" width="200" height="48" rx="14" fill="#14532d" stroke="#25d366"/>
    <text x="140" y="440" fill="#ffffff" text-anchor="middle" font-weight="600">Enviar resposta</text>
  </g>
</svg>
